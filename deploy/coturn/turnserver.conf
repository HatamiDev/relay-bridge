# coturn config for turn.hatamidev.com
#
# Install: copy to /etc/turnserver.conf, fill in static-auth-secret to match
# TURN_STATIC_AUTH_SECRET in server/.env.production, then
#   systemctl enable --now coturn
# (deploy/install.sh does the copy + secret substitution.)

# ── Identity ─────────────────────────────────────────────────────────────
realm=hatamidev.com
server-name=turn.hatamidev.com

# Time-limited credential mode (draft-uberti-behave-turn-rest-00). The
# server mints "<expiry>:<roomId>" / HMAC-SHA1 credentials per src/turn.js —
# coturn must be told the same secret to validate them, and no static
# username/password pair is ever configured.
use-auth-secret
static-auth-secret=CHANGE_ME_must_equal_TURN_STATIC_AUTH_SECRET

# ── Listeners ────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Same certificate nginx uses for the web domain; coturn only needs read
# access to the files (see deploy/install.sh for the permission grant).
cert=/etc/letsencrypt/live/hatamidev.com/fullchain.pem
pkey=/etc/letsencrypt/live/hatamidev.com/privkey.pem
cipher-list="HIGH"
no-tlsv1
no-tlsv1_1

# Relay candidates are handed out from this port range; open it in the
# firewall (see deploy/README.md).
min-port=49152
max-port=65535

# ── SSRF protection ──────────────────────────────────────────────────────
# A TURN server is, by design, a UDP/TCP relay a client fully controls the
# destination of. Without this block, an attacker who obtains a valid
# time-limited credential (or bypasses auth via a coturn misconfiguration)
# can point the relay at YOUR internal network — 169.254.169.254 (cloud
# metadata endpoints that hand out IAM credentials), 10.0.0.0/8 or your VPC's
# private ranges, the loopback interface Redis/nginx/the app listen on, etc.
# — and use the TURN server as an anonymous SSRF proxy into infrastructure
# that was never meant to be reachable from the internet. denied-peer-ip
# refuses to relay to any of these ranges no matter what a client asks for.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ── Hygiene ──────────────────────────────────────────────────────────────
# Never relay to/from this box's own public IP either — closes the loop on
# the SSRF concern above for the one address range denied-peer-ip can't
# express generically. Replace with the host's actual public IP.
# denied-peer-ip=CHANGE_ME_this_hosts_public_ip

fingerprint
lt-cred-mech
no-multicast-peers
no-cli
mobility
stale-nonce=600

# Calls are voice-only; capping relayed bandwidth per allocation is cheap
# insurance against a compromised credential being used to relay bulk data.
max-bps=1000000
total-quota=100

log-file=/var/log/turnserver/turnserver.log
verbose
