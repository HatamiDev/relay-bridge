# Redis config for the relay signaling server's room store.
#
# Install: copy to /etc/redis/redis.conf (or /etc/redis/redis-relay.conf if
# you run a dedicated instance), set requirepass, then
#   systemctl enable --now redis-server
# (deploy/install.sh does the copy for the default single-instance case.)

# ── Network ──────────────────────────────────────────────────────────────
# Loopback only — the relay app on the same box is the only client. Redis
# has no business being reachable from the network; nginx and coturn never
# talk to it either.
bind 127.0.0.1 -::1
port 6379
protected-mode yes

# openssl rand -hex 32, then set REDIS_URL=redis://:<same value>@127.0.0.1:6379
requirepass CHANGE_ME_openssl_rand_hex_32

# ── Persistence ──────────────────────────────────────────────────────────
# AOF over RDB-only: a room holds live pairing state (device keys, socket
# presence, offline-message queues) that a restart should not silently lose
# mid-call. appendfsync everysec is the standard durability/throughput
# tradeoff — worst case loses ~1s of writes, never a corrupt file.
appendonly yes
appendfsync everysec
appendfilename "relay.aof"
dir /var/lib/redis

# ── Eviction ───────────────────────────────────────────────────────────
# noeviction, not the allkeys-lru/volatile-* default many guides recommend:
# every key here (relay:room:*, relay:code:*, relay:device:*) is load-bearing
# pairing state, not a cache. If Redis were allowed to evict under memory
# pressure, it would silently unpair a live gateway/receiver pair — the
# devices would keep believing they're paired while the server has forgotten
# the room entirely, with no error surfaced to either handset. Failing writes
# with OOM once maxmemory is hit is loud and recoverable (bump maxmemory,
# investigate); silent eviction of pairing state is not.
maxmemory 256mb
maxmemory-policy noeviction

# ── Hygiene ──────────────────────────────────────────────────────────────
# Nothing here should ever be observable from outside this host or process;
# rename away the two commands that could otherwise nuke the dataset or leak
# the whole keyspace to a client that got past auth some other way.
rename-command FLUSHALL ""
rename-command FLUSHDB ""

supervised systemd
loglevel notice
logfile /var/log/redis/redis-server.log
