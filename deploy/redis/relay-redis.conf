# A SECOND Redis instance, dedicated to the relay, on port 6380.
#
# Why not reuse the Redis the box may already have on 6379:
#
#   * Adding `requirepass` to a shared instance instantly breaks every
#     existing client that connects without a password — the website would
#     start throwing NOAUTH errors the moment redis restarts.
#   * `maxmemory-policy noeviction` is correct for pairing state and wrong
#     for a website cache; on a shared instance one of the two has to lose.
#   * `rename-command FLUSHALL ""` would break any tooling the site uses.
#
# Two instances cost a few MB of RAM and remove the whole class of problem.
#
# Install: /etc/redis/relay-redis.conf, paired with
# deploy/systemd/redis-relay.service.

# ── Network ──────────────────────────────────────────────────────────────
# Loopback only. The relay app on this same box is the only client that
# should ever reach it; nginx and coturn never talk to Redis at all.
bind 127.0.0.1 -::1
port 6380
protected-mode yes

# openssl rand -hex 32
# The same value goes into REDIS_URL in /opt/relay/server/.env as
#   redis://:<value>@127.0.0.1:6380
requirepass CHANGE_ME_openssl_rand_hex_32

# ── Files ────────────────────────────────────────────────────────────────
# Separate dir, pidfile and logfile from the default instance so the two
# never fight over the same AOF or clobber each other's PID.
dir /var/lib/redis-relay
pidfile /run/redis-relay/redis-relay.pid
logfile /var/log/redis/redis-relay.log
unixsocket ""

# ── Persistence ──────────────────────────────────────────────────────────
# AOF, not RDB-only: a room holds live pairing state — device keys, presence,
# queued offline messages — that a restart must not silently lose mid-call.
# `everysec` is the standard tradeoff: worst case loses about a second of
# writes, never a corrupt file.
appendonly yes
appendfsync everysec
appendfilename "relay.aof"
save ""

# ── Eviction ─────────────────────────────────────────────────────────────
# noeviction, not the allkeys-lru that most tuning guides suggest. Every key
# here is load-bearing pairing state, not a cache. Under memory pressure LRU
# would silently unpair a live gateway/receiver pair — both handsets would go
# on believing they are paired while the server has forgotten the room, with
# no error shown to either. Failing writes with OOM is loud and fixable;
# silent eviction of pairing state is neither.
maxmemory 256mb
maxmemory-policy noeviction

# ── Hygiene ──────────────────────────────────────────────────────────────
rename-command FLUSHALL ""
rename-command FLUSHDB ""

supervised systemd
loglevel notice
