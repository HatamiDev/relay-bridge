# nginx site: hatamidev.com — TLS termination + reverse proxy for the relay
# signaling server (Express HTTP routes + Socket.IO WebSocket, both served
# from the same Node process on 127.0.0.1:8443).
#
# Install: copy to /etc/nginx/sites-available/hatamidev.com.conf, then
#   ln -s /etc/nginx/sites-available/hatamidev.com.conf /etc/nginx/sites-enabled/
# (deploy/install.sh does this for you.)

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hatamidev.com;

    # Let certbot's HTTP-01 challenge through before a certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hatamidev.com;

    ssl_certificate     /etc/letsencrypt/live/hatamidev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hatamidev.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: this domain only ever serves the relay over TLS, so tell browsers
    # to stop trying plaintext for a long time. `preload` only matters once
    # you submit to the HSTS preload list; harmless to leave in either way.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Zero-knowledge relay: nothing here should ever be framed, sniffed as a
    # different content type, or leak a referrer to a third party.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    client_max_body_size 256k;

    # /health is a liveness probe (uptime, room/device counts, no secrets) —
    # deliberately reachable without a bootstrap secret or device token so a
    # load balancer or monitoring agent can poll it.
    location = /health {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — the WebSocket upgrade path.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # Without these two, nginx proxies the WS upgrade handshake as a
        # plain HTTP request and the client falls back to (or gets stuck on)
        # long-polling instead of a real WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        # $http_upgrade is empty on a normal HTTP request and "websocket" on
        # an upgrade request; nginx has no built-in map for "keep-alive vs
        # upgrade" so this expression does it inline.
        proxy_set_header Connection $connection_upgrade;

        # Calls can sit idle (ringing, held) far longer than nginx's default
        # 60s proxy_read_timeout. Socket.IO pings every 20s
        # (see src/signaling.js pingInterval), so 3600s just needs to outlast
        # any *single* idle gap, not the whole call — but a generous ceiling
        # here means a slow network hiccup never gets nginx to kill the
        # socket out from under an active pairing session or call.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the REST pairing/session/ICE API.
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# nginx has no built-in ternary; this map turns the client's Connection
# header into "upgrade" only when Upgrade was actually requested, and
# "close" otherwise — required by both proxied locations above.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
