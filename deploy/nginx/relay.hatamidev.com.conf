# nginx site: relay.hatamidev.com — the signaling server, on its own subdomain.
#
# This file exists so the relay can live on a host that ALREADY serves a
# website. It is a self-contained pair of server blocks for one subdomain and
# touches nothing else:
#
#   * `server_name` is the subdomain only, so requests for hatamidev.com keep
#     matching whatever server block already handles them.
#   * The websocket `map` is named `$relay_connection_upgrade`, not the usual
#     `$connection_upgrade`. nginx refuses to start if two configs declare a
#     map for the same variable name — if the existing site already proxies a
#     websocket, the conventional name would collide and take the whole web
#     server down on reload.
#   * No `default_server`, no `listen ... default_server`, nothing that could
#     capture traffic meant for the main site.
#
# Install: /etc/nginx/sites-available/relay.hatamidev.com.conf and symlink it
# into sites-enabled (deploy/install-coexist.sh does this).

map $http_upgrade $relay_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name relay.hatamidev.com;

    # Certbot's HTTP-01 challenge has to be reachable over plain HTTP before a
    # certificate exists, so it is served from disk rather than redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.hatamidev.com;

    ssl_certificate     /etc/letsencrypt/live/relay.hatamidev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.hatamidev.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSLrelay:10m;
    ssl_session_timeout 1d;

    # HSTS deliberately WITHOUT includeSubDomains.
    #
    # This is a subdomain of a host that serves a real website. Sending
    # includeSubDomains from here would pin HTTPS on sibling subdomains too —
    # including any that are still HTTP-only — and browsers would refuse to
    # load them for the next two years with no way to undo it from the server.
    add_header Strict-Transport-Security "max-age=63072000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY"  always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # The largest legitimate request is one encrypted envelope
    # (MAX_ENVELOPE_BYTES=131072) plus headers. Anything bigger is a mistake
    # or an attack, and rejecting it at nginx keeps it away from Node.
    client_max_body_size 256k;

    # Liveness probe: uptime and room counts, no secrets. Intentionally open
    # so a monitor can poll it without a device token.
    location = /health {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — the WebSocket upgrade path.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # Without these two nginx forwards the upgrade as a plain request and
        # the client silently degrades to long-polling — which still "works",
        # just with seconds of added latency on every call setup.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $relay_connection_upgrade;

        # A ringing or held call is idle far longer than nginx's 60s default.
        # Socket.IO pings every 20s, so this ceiling only has to outlast a
        # network hiccup, never the call itself.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the REST pairing / session / ICE API.
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
