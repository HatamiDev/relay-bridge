org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# ── Deployment configuration ──────────────────────────────────────────────────
# Override on the CLI:  ./gradlew -PrelayServerUrl=https://hatamidev.com ...
relayServerUrl=https://hatamidev.com
# Must match BOOTSTRAP_SECRET in the server .env. Gateway build only.
relayBootstrapSecret=CHANGE_ME_openssl_rand_hex_32
